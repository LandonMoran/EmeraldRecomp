name: Android APK

# Builds the installable debug APK on a GitHub runner (no local Android
# toolchain needed) and leaves it as a downloadable artifact on the run.
#
# The APK still asks for the player's own ROM dump and BIOS on first launch;
# nothing copyrighted is bundled.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  apk:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out the game and its engine submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Installed by hand rather than with an action: the runner image ships an
      # sdkmanager the actions refuse, and the versions here are the ones the
      # Gradle files pin (compileSdk 35, NDK 27.1, CMake 3.22).
      - name: Install Android SDK, NDK and CMake
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o "$RUNNER_TEMP/cmdline-tools.zip" \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$SDK" "$SDK" >> "$GITHUB_ENV"

      - name: Build the debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: emeraldrecomp-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
