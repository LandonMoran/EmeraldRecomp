plugins {
    id "com.android.application"
}

// Engine / UI checkouts: the pinned submodules by default; a feature worktree
// can be selected with -PgbarecompRoot=... / -PrecompUiRoot=... (or the
// GBARECOMP_ROOT / RECOMP_UI_ROOT environment variables).
def gameRoot = rootDir.parentFile
def pick = { String prop, String env, File fallback ->
    def v = providers.gradleProperty(prop).orNull ?: System.getenv(env)
    return v ? new File(v) : fallback
}
def engineRoot = pick("gbarecompRoot", "GBARECOMP_ROOT", new File(gameRoot, "gbarecomp"))
def recompUiRoot = pick("recompUiRoot", "RECOMP_UI_ROOT", new File(gameRoot, "recomp-ui"))

ext.gbaGame = [
    applicationId : "com.mstan.emeraldrecomp",
    versionCode   : 108,
    versionName   : "0.1.8",
    title         : "Pokémon Emerald",
    romLabel      : "Pokémon Emerald (USA) ROM",
    romSha1       : ["f3ae088181bf583e55daf962a92bb46f4f1d07b7"],
    romSize       : 16777216,
    romFile       : "emerald_usa.gba",
    saveFile      : "saves/emerald_usa.sav",
    saveBytes     : 131072,
    biosRequired  : true,
    orientation   : "any",
    payloadVersion: "4",
    setupNote     : "Play in portrait or landscape: draw a path to walk, tap menus, " +
                    "long-press for the Start menu.",
    variant       : "emerald",
    gameToml      : new File(rootDir, "game_android.toml"),
    payloadDirs   : [
        [from: new File(gameRoot, "mods/preloaded"), into: "mods"],
        [from: new File(rootDir, "payload/mods"), into: "mods"],
        [from: new File(gameRoot, "tools/release-licenses"), into: "licenses/fonts"],
        [from: new File(gameRoot, "tools/android-licenses"), into: "licenses/Android-NDK"],
        [from: new File(gameRoot, "LICENSE"), into: "licenses/title"],
        [from: new File(gameRoot, "PERMISSIONS.md"), into: "licenses/title"],
        [from: new File(engineRoot, "LICENSE"), into: "licenses/gbarecomp"],
        [from: new File(engineRoot, "external/arm-recomp-core/LICENSE"), into: "licenses/arm-recomp-core"],
        [from: new File(engineRoot, "external/recomp-net/LICENSE"), into: "licenses/recomp-net"],
        [from: new File(engineRoot, "external/rbengine/LICENSE"), into: "licenses/rbengine"],
        [from: new File(engineRoot, "platform/android/third_party/SDL/LICENSE.txt"), into: "licenses/SDL2"],
        [from: new File(recompUiRoot, "LICENSE"), into: "licenses/recomp-ui"],
        [from: new File(recompUiRoot, "src/third_party/imgui/LICENSE.txt"), into: "licenses/Dear-ImGui"],
    ],
    gameRoot      : gameRoot,
    engineRoot    : engineRoot,
    recompUiRoot  : recompUiRoot,
    cmakeArguments: ["-DGBARECOMP_GENERATED_BIOS_DIR=" +
        pick("generatedBiosRoot", "GBARECOMP_GENERATED_BIOS_DIR",
            new File(engineRoot, "src/runtime/generated_bios")).absolutePath.replace('\\', '/'),
        "-DGBA_GAME_GENERATED_ROOT=" +
        pick("generatedGameRoot", "GBA_GAME_GENERATED_ROOT",
            new File(gameRoot, "variants/emerald/generated")).absolutePath.replace('\\', '/')],
]

apply from: new File(engineRoot, "platform/android/gbarecomp-app.gradle")

// Game-owned Java sources: the spoken-UI / TalkBack bridge
// (src/accessibility/emerald_a11y_android.cpp resolves this class from native
// code) and the spoken setup screen. Added to the shared shell's app module
// without editing the engine checkout.
//
// The engine declares org.gbarecomp.GbaSetupActivity as the launcher. The game
// subclasses it (EmeraldSetupActivity) so ROM/BIOS import, verification and the
// saved-game screen are narrated instead of silent. Point the launcher at the
// subclass by deriving the app manifest from the engine's: only the one
// activity class name is rewritten, so engine manifest changes (metadata,
// permissions, new activities) still flow through untouched.
//
// The generated copy lives in android/app/generated (git-ignored), not in
// build/: a single `gradlew clean assembleDebug` would otherwise configure,
// then delete it with clean/, and leave the manifest merger without an input.
def engineManifestFile = new File(engineRoot, "platform/android/AndroidManifest.xml")
def spokenManifestFile = new File(gameRoot,
    "android/app/generated/emeraldManifest/AndroidManifest.xml")
def engineManifestText = engineManifestFile.getText("UTF-8")
def engineLauncher = 'android:name="org.gbarecomp.GbaSetupActivity"'
def spokenLauncher = 'android:name="com.mstan.emeraldrecomp.accessibility.EmeraldSetupActivity"'
if (!engineManifestText.contains(engineLauncher)) {
    throw new GradleException(
        "The shared Android manifest no longer declares org.gbarecomp.GbaSetupActivity. " +
        "Update the spoken-setup manifest rewrite in android/app/build.gradle.")
}
def spokenManifestText = engineManifestText.replace(engineLauncher, spokenLauncher)
if (!spokenManifestFile.exists() ||
    spokenManifestFile.getText("UTF-8") != spokenManifestText) {
    spokenManifestFile.parentFile.mkdirs()
    spokenManifestFile.setText(spokenManifestText, "UTF-8")
}

android {
    sourceSets {
        main {
            java.srcDirs += new File(gameRoot, "android/app/src/main/java")
            manifest.srcFile spokenManifestFile
        }
    }
}
